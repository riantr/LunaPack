name: Release

# Publish a release when a version tag is pushed.
#
# The tag is the source of truth: `v1.2.3` becomes version 1.2.3. Every
# platform is built on its own runner so the binaries are native, and the
# result is attached to a GitHub Release.
#
# The same tag is also published to the Mooncakes registry so that
# `moonx riantr/LunaPack@latest` resolves.
#
# LunaPack Studio is part of this one release, not a separate package. Its zip
# is built by the build-studio job below on a clean Windows runner, then picked
# up by the release job through the shared artifact directory. Release assets
# are CI-only: the publish job mints a dedicated GitHub App token, prunes any
# asset that this run did not build, and checks every digest and uploader before
# the job is green. A missing Studio zip is reported, never patched by hand.
# `lunapack --GUI` downloads the asset by name from this very release, so the
# name must stay in step with studio_asset_name() in studio.mbt.
#
# Required GitHub configuration (see README.mbt.md, "CI-only release assets"):
#   - a GitHub App with Contents: read & write, Metadata: read-only, installed
#     on this repository only;
#   - `release` environment variable RELEASE_APP_CLIENT_ID;
#   - `release` environment secret RELEASE_APP_PRIVATE_KEY;
#   - repository variable RELEASE_APP_LOGIN = <app-slug>[bot], used by the
#     daily `release-audit.yml` check;
#   - human accounts/teams must not keep Contents: write on this repository.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The tag must agree with the version in moon.mod, otherwise the published
  # module and the release would disagree.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify the tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag against moon.mod
        id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared=$(grep -E '^version[[:space:]]*=' moon.mod | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag says $version but moon.mod says $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

  # ---------------------------------------------------------------------------
  # Build the native binary on each platform.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            binary: lunapack-linux-x86_64
          - os: windows-latest
            name: Windows
            binary: lunapack-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: bash
        run: moon build --release --target native

      - name: Collect the binary
        shell: bash
        run: |
          # The build directory also holds intermediate artefacts named
          # LunaPack.core, LunaPack.c and so on, so the executable is copied by
          # its exact name. The toolchain calls it LunaPack.exe on every
          # platform.
          mkdir -p dist
          cp "_build/native/release/build/LunaPack.exe" "dist/${{ matrix.binary }}"
          chmod +x "dist/${{ matrix.binary }}" || true
          ls -la dist/

      - name: Smoke test
        shell: bash
        run: |
          # The binary must start and print its usage; a full round trip is
          # covered by the test suite.
          "dist/${{ matrix.binary }}" --help | tee output.txt
          grep -q "usage" output.txt

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The macOS binary is built on a runner that is not always there: a tag that
  # is pushed when no macOS runner is free leaves this job without one. The
  # job does not hold the release then: the release is made with the binaries
  # that were built, and its notes name the one that is missing.
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS
    needs: verify-tag
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: bash
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: moon build --release --target native

      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p dist
          cp "_build/native/release/build/LunaPack.exe" "dist/lunapack-macos-aarch64"
          chmod +x "dist/lunapack-macos-aarch64" || true
          ls -la dist/

      - name: Smoke test
        shell: bash
        run: |
          "dist/lunapack-macos-aarch64" --help | tee output.txt
          grep -q "usage" output.txt

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-lunapack-macos-aarch64
          path: dist/lunapack-macos-aarch64
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The Wasm build, which is what `moonx` runs.
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Wasm
    needs: verify-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: moon build --release --target wasm

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp _build/wasm/release/build/LunaPack.wasm dist/lunapack.wasm
          # The .core file holds the compiled package the wasm module needs.
          cp _build/wasm/release/build/LunaPack.core dist/lunapack.core
          ls -la dist/

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-lunapack-wasm
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The Windows in-process runtime and the virtual launcher. They live in
  # their own MoonBit module (runtime/) and are Windows-only; plain CLI
  # binaries do not depend on them. This job is deliberately not a release
  # blocker, but a release without these files cannot run --virtual bundles.
  # ---------------------------------------------------------------------------
  build-runtime:
    name: Windows runtime and virtual launcher
    needs: verify-tag
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build, link and exercise the runtime
        shell: pwsh
        run: ./scripts/build_runtime_windows.ps1 -Consume

      - name: Upload the runtime and virtual launcher
        uses: actions/upload-artifact@v4
        with:
          name: binary-runtime-windows
          path: |
            dist/lpvirt.dll
            dist/lpvhost.exe
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # LunaPack Studio. proton_cli and CEF are a Windows desktop toolchain, so
  # this leg runs on windows-latest rather than on the machine doing the
  # release. A clean runner also avoids the local antivirus deleting files in
  # the packaging staging directory, which is what kept earlier releases from
  # shipping a Studio zip. The job is optional: a failure here leaves the CLI
  # and runtime release intact and the notes say the zip is missing.
  # ---------------------------------------------------------------------------
  build-studio:
    name: Studio (Windows)
    needs: verify-tag
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the locked Studio tools
        shell: pwsh
        run: |
          moon update
          moon install moonbit-community/warren@0.4.5
          moon install moonbit-community/proton_cli@0.10.0
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          proton_cli --version

      - name: Prepare the CEF runtime
        shell: pwsh
        working-directory: studio
        run: |
          proton_cli setup
          proton_cli doctor

      - name: Package
        shell: pwsh
        working-directory: studio
        run: proton_cli package --release

      - name: Name the asset after the release tag
        shell: pwsh
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          $source = 'studio/dist/lunapack-studio.zip'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "proton_cli did not produce $source"
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $target = "dist/lunapack-studio-windows-x86_64.zip"
          Copy-Item -LiteralPath $source -Destination $target -Force
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item -LiteralPath $target).Length
          "studio zip: $size bytes, sha256=$hash, version=$VERSION"
          "SHA256=$hash" >> "$env:GITHUB_ENV"

      - name: Upload the Studio zip
        uses: actions/upload-artifact@v4
        with:
          name: binary-lunapack-studio
          path: dist/lunapack-studio-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish to the Mooncakes registry, so
  # `moonx riantr/LunaPack@latest` resolves to this version.
  # ---------------------------------------------------------------------------
  publish-registry:
    name: Publish to Mooncakes
    needs: [verify-tag]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install MoonBit
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The registry token is stored in the credentials file the toolchain
      # reads; it comes from the repository secret, never from the log.
      - name: Write the registry credentials
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::warning::MOONCAKES_TOKEN is not set, skipping the registry publication"
            exit 0
          fi
          mkdir -p "$HOME/.moon"
          printf '{\n  "token": "%s"\n}\n' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"

      - name: Publish
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::warning::no registry token, skipping"
            exit 0
          fi
          # A re-run for a tag that was published before makes the registry
          # refuse the duplicate version. That is not a failure of the
          # release: the GitHub Release is still updated with the freshly
          # built binaries. `moon publish` also type-checks the project first,
          # so other failures (a broken build, an expired token, no network)
          # land here too - keep the wording honest about all of them.
          moon publish || {
            echo "::warning::moon publish failed (the version may already exist); continuing so the GitHub Release is still updated"
          }

  # ---------------------------------------------------------------------------
  # Attach everything to the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the GitHub Release
    # The macOS runner is the scarce one: when none of them is free, that leg
    # is cancelled and the release is made with the binaries that were built,
    # with the missing one named in its notes. The other legs are not
    # optional, so the release waits for them and stops if one of them
    # failed.
    if: >-
      always() &&
      needs.verify-tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build-wasm.result == 'success' &&
      needs.publish-registry.result == 'success'
    needs: [verify-tag, build, build-macos, build-wasm, build-runtime, publish-registry, build-studio]
    runs-on: ubuntu-latest
    environment: release

    # GITHUB_TOKEN stays read-only. The only Contents: write identity in this
    # job is the short-lived GitHub App token minted below.
    permissions:
      contents: read

    steps:
      - name: Check release automation configuration
        shell: bash
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_CLIENT_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error::release automation is not configured: set RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY on the 'release' environment"
            exit 1
          fi

      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        shell: bash
        run: ls -la artifacts/

      # A re-run must not keep an asset from a previous run or from a laptop.
      # Keep only the files this workflow just downloaded, then let the upload
      # below replace same-named assets with the freshly built bytes.
      - name: Prune unapproved release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No existing release for $TAG; nothing to prune"
            exit 0
          fi

          shopt -s nullglob
          declare -A approved=()
          for file in artifacts/*; do
            approved[$(basename "$file")]=1
          done

          rel_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel_id/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            if [ -n "${approved[$name]:-}" ]; then
              echo "Keeping approved asset $name"
            else
              echo "Deleting unapproved asset $name"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
            fi
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        shell: bash
        run: |
          # The annotated tag carries the release notes, so they are used as
          # they are instead of being generated again.
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$NOTES" ]; then
            NOTES="LunaPack $VERSION"
          fi
          # A binary that could not be built is named in the notes, so that the
          # release says what it holds instead of pretending to be complete.
          for name in lunapack-linux-x86_64 lunapack-macos-aarch64 lunapack-windows-x86_64.exe lunapack.wasm; do
            if [ ! -f "artifacts/$name" ]; then
              NOTES="$NOTES"$'\n\n'"The binary $name is not part of this release: the runner that builds it was not available when the tag was pushed."
            fi
          done
          # The runtime and launcher come from an optional job, so their
          # absence has a different explanation from a missing runner.
          if [ ! -f "artifacts/lpvirt.dll" ] || [ ! -f "artifacts/lpvhost.exe" ]; then
            NOTES="$NOTES"$'\n\n'"The Windows virtual runtime is incomplete in this release: lpvirt.dll and/or lpvhost.exe were not produced by the optional build job. Plain bundles still work, but `lunapack bundle --virtual` needs both files."
          fi
          # The build-studio job is optional, so the asset may be missing. The
          # CLI still works without it, but `lunapack --GUI` has nothing to
          # download; say so instead of leaving a silent 404.
          if ! ls artifacts/lunapack-studio-*.zip >/dev/null 2>&1; then
            NOTES="$NOTES"$'\n\n'"LunaPack Studio was not attached to this release: the optional build-studio job did not produce a zip. lunapack --GUI cannot auto-download it until this tag is released again with a successful build-studio job; release assets are CI-only and manual uploads are rejected."
          fi
          # A tag that already carries a release is reused, so re-running the
          # workflow replaces the assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "LunaPack $VERSION" --notes "$NOTES"
            echo "updated the existing release $TAG"
          else
            gh release create "$TAG" artifacts/* \
              --title "LunaPack $VERSION" \
              --notes "$NOTES"
          fi

      - name: Verify the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EXPECTED_UPLOADER: "${{ steps.app-token.outputs.app-slug }}[bot]"
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[] | .name]}'

          # A missing virtual-runtime asset is a warning, not a failed release:
          # plain bundles still work, but --virtual needs both files.
          RUNTIME=$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name | select(. == "lpvirt.dll" or . == "lpvhost.exe")] | length')
          if [ "$RUNTIME" != "2" ]; then
            echo "::warning::virtual runtime incomplete ($RUNTIME/2 assets); --virtual cannot run from this release"
          else
            echo "Virtual runtime assets attached: $RUNTIME/2"
          fi
          # A missing Studio asset is a warning, not a failed release: the CLI
          # binaries above are complete. Re-run the tag with build-studio green;
          # do not attach a zip from a developer machine.
          STUDIO=$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name | select(startswith("lunapack-studio-"))] | length')
          if [ "$STUDIO" = "0" ]; then
            echo "::warning::no lunapack-studio-*.zip asset; --GUI cannot auto-download until build-studio succeeds in a new release run"
          else
            echo "Studio assets attached: $STUDIO"
          fi

          # `gh release view` does not expose uploader.login, so read the REST
          # representation of the release assets instead.
          rel_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel_id/assets" \
            --jq '.[] | [.name, .digest, (.size|tostring), .uploader.login] | @tsv' \
            > release-assets.tsv

          shopt -s nullglob
          if [ ! -e artifacts/lunapack.wasm ]; then
            echo "::error::no downloaded artifacts found; cannot verify the release"
            exit 1
          fi

          declare -A expected_digest expected_size
          for file in artifacts/*; do
            name=$(basename "$file")
            expected_digest["$name"]="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            expected_size["$name"]=$(stat -c%s "$file")
          done

          failed=0

          # Every artifact built by this run must be on the release with the
          # same bytes and must have been uploaded by the release App.
          for name in "${!expected_digest[@]}"; do
            line=$(awk -F '\t' -v n="$name" '$1 == n { print; exit }' release-assets.tsv)
            if [ -z "$line" ]; then
              echo "::error::artifact $name is missing from release $TAG"
              failed=1
              continue
            fi
            IFS=$'\t' read -r aname adigest asize auploader <<< "$line"
            if [ "$adigest" != "${expected_digest[$name]}" ]; then
              echo "::error::$name digest is $adigest on the release, expected ${expected_digest[$name]}"
              failed=1
            fi
            if [ "$asize" != "${expected_size[$name]}" ]; then
              echo "::error::$name size is $asize on the release, expected ${expected_size[$name]}"
              failed=1
            fi
            if [ "$auploader" != "$EXPECTED_UPLOADER" ]; then
              echo "::error::$name was uploaded by '$auploader', expected '$EXPECTED_UPLOADER'"
              failed=1
            fi
          done

          # The reverse check catches assets added by hand after the workflow
          # uploaded its own files, including same-named files with a new digest.
          while IFS=$'\t' read -r aname adigest asize auploader; do
            [ -n "$aname" ] || continue
            if [ -z "${expected_digest[$aname]:-}" ]; then
              echo "::error::release asset $aname was not built by this workflow"
              failed=1
            fi
            if [ "$auploader" != "$EXPECTED_UPLOADER" ]; then
              echo "::error::release asset $aname was uploaded by '$auploader', expected '$EXPECTED_UPLOADER'"
              failed=1
            fi
          done < release-assets.tsv

          if [ "$failed" -ne 0 ]; then
            echo "::error::release verification failed; assets on $TAG are not exactly the artifacts built by this workflow"
            exit 1
          fi
          echo "Verified ${#expected_digest[@]} assets: digest, size and uploader ($EXPECTED_UPLOADER) all match"
