name: Release

# Publish a release when a version tag is pushed.
#
# The tag is the source of truth: `v1.2.3` becomes version 1.2.3. Every
# platform is built on its own runner so the binaries are native, and the
# result is attached to a GitHub Release.
#
# The same tag is also published to the Mooncakes registry so that
# `moonx riantr/LunaPack/cmd/main@latest` resolves.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The tag must agree with the version in moon.mod, otherwise the published
  # module and the release would disagree.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify the tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag against moon.mod
        id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared=$(grep -E '^version[[:space:]]*=' moon.mod | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag says $version but moon.mod says $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

  # ---------------------------------------------------------------------------
  # Build the native binary on each platform.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            binary: lunapack-linux-x86_64
          - os: macos-15
            name: macOS
            binary: lunapack-macos-aarch64
          - os: windows-latest
            name: Windows
            binary: lunapack-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: bash
        run: moon build --release --target native

      - name: Collect the binary
        shell: bash
        run: |
          # The build directory also holds intermediate artefacts named
          # main.core, main.c and so on, so the executable is copied by its
          # exact name. The toolchain calls it main.exe on every platform.
          mkdir -p dist
          cp "_build/native/release/build/cmd/main/main.exe" "dist/${{ matrix.binary }}"
          chmod +x "dist/${{ matrix.binary }}" || true
          ls -la dist/

      - name: Smoke test
        shell: bash
        run: |
          # The binary must start and print its usage; a full round trip is
          # covered by the test suite.
          "dist/${{ matrix.binary }}" --help | tee output.txt
          grep -q "usage" output.txt

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The Wasm build, which is what `moonx` runs.
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Wasm
    needs: verify-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: moon build --release --target wasm

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp _build/wasm/release/build/cmd/main/main.wasm dist/lunapack.wasm
          # The .core file holds the compiled package the wasm module needs.
          cp _build/wasm/release/build/cmd/main/main.core dist/lunapack.core
          ls -la dist/

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-lunapack-wasm
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish to the Mooncakes registry, so
  # `moonx riantr/LunaPack/cmd/main@latest` resolves to this version.
  # ---------------------------------------------------------------------------
  publish-registry:
    name: Publish to Mooncakes
    needs: [verify-tag]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install MoonBit
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The registry token is stored in the credentials file the toolchain
      # reads; it comes from the repository secret, never from the log.
      - name: Write the registry credentials
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::warning::MOONCAKES_TOKEN is not set, skipping the registry publication"
            exit 0
          fi
          mkdir -p "$HOME/.moon"
          printf '{\n  "token": "%s"\n}\n' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"

      - name: Publish
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::warning::no registry token, skipping"
            exit 0
          fi
          # The registry refuses a version that already exists, which happens
          # when the workflow is re-run for a tag that was published before.
          # That is not a failure of the release: the GitHub Release is still
          # updated with the freshly built binaries.
          moon publish || {
            echo "::warning::the version is already published, continuing"
          }

  # ---------------------------------------------------------------------------
  # Attach everything to the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the GitHub Release
    needs: [verify-tag, build, build-wasm, publish-registry]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        shell: bash
        run: |
          # The annotated tag carries the release notes, so they are used as
          # they are instead of being generated again.
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$NOTES" ]; then
            NOTES="LunaPack $VERSION"
          fi
          # A tag that already carries a release is reused, so re-running the
          # workflow replaces the assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "LunaPack $VERSION" --notes "$NOTES"
            echo "updated the existing release $TAG"
          else
            gh release create "$TAG" artifacts/* \
              --title "LunaPack $VERSION" \
              --notes "$NOTES"
          fi

      - name: Verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[] | .name]}'
