name: Release

# Publish a release when a version tag is pushed.
#
# The tag is the source of truth: `v1.2.3` becomes version 1.2.3. Every
# platform is built on its own runner so the binaries are native, and the
# result is attached to a GitHub Release.
#
# The same tag is also published to the Mooncakes registry so that
# `moonx riantr/LunaPack@latest` resolves.
#
# LunaPack Studio is part of this one release, not a separate package. Its
# zip is built with proton_cli in the sibling Studio workspace and attached
# alongside these binaries with:
#   gh release upload "$TAG" lunapack-studio-<os>-<arch>.zip --clobber
# `lunapack --GUI` downloads that asset by name from this very release, so
# the asset name must stay in step with studio_asset_name() in studio.mbt.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The tag must agree with the version in moon.mod, otherwise the published
  # module and the release would disagree.
  # ---------------------------------------------------------------------------
  verify-tag:
    name: Verify the tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag against moon.mod
        id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared=$(grep -E '^version[[:space:]]*=' moon.mod | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $tag says $version but moon.mod says $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

  # ---------------------------------------------------------------------------
  # Build the native binary on each platform.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            binary: lunapack-linux-x86_64
          - os: windows-latest
            name: Windows
            binary: lunapack-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: bash
        run: moon build --release --target native

      - name: Collect the binary
        shell: bash
        run: |
          # The build directory also holds intermediate artefacts named
          # LunaPack.core, LunaPack.c and so on, so the executable is copied by
          # its exact name. The toolchain calls it LunaPack.exe on every
          # platform.
          mkdir -p dist
          cp "_build/native/release/build/LunaPack.exe" "dist/${{ matrix.binary }}"
          chmod +x "dist/${{ matrix.binary }}" || true
          ls -la dist/

      - name: Smoke test
        shell: bash
        run: |
          # The binary must start and print its usage; a full round trip is
          # covered by the test suite.
          "dist/${{ matrix.binary }}" --help | tee output.txt
          grep -q "usage" output.txt

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The macOS binary is built on a runner that is not always there: a tag that
  # is pushed when no macOS runner is free leaves this job without one. The
  # job does not hold the release then: the release is made with the binaries
  # that were built, and its notes name the one that is missing.
  # ---------------------------------------------------------------------------
  build-macos:
    name: macOS
    needs: verify-tag
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: bash
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: moon build --release --target native

      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p dist
          cp "_build/native/release/build/LunaPack.exe" "dist/lunapack-macos-aarch64"
          chmod +x "dist/lunapack-macos-aarch64" || true
          ls -la dist/

      - name: Smoke test
        shell: bash
        run: |
          "dist/lunapack-macos-aarch64" --help | tee output.txt
          grep -q "usage" output.txt

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-lunapack-macos-aarch64
          path: dist/lunapack-macos-aarch64
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The Wasm build, which is what `moonx` runs.
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Wasm
    needs: verify-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: moon build --release --target wasm

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp _build/wasm/release/build/LunaPack.wasm dist/lunapack.wasm
          # The .core file holds the compiled package the wasm module needs.
          cp _build/wasm/release/build/LunaPack.core dist/lunapack.core
          ls -la dist/

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-lunapack-wasm
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The experimental in-process runtime DLL. It lives in its own MoonBit
  # module (runtime/) and is Windows-only; the CLI binaries above do not
  # depend on it. This job is deliberately not a release blocker.
  # ---------------------------------------------------------------------------
  build-runtime:
    name: Windows runtime DLL
    needs: verify-tag
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install MoonBit
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build, link and exercise the runtime
        shell: pwsh
        run: ./scripts/build_runtime_windows.ps1 -Consume

      - name: Upload the runtime DLL
        uses: actions/upload-artifact@v4
        with:
          name: binary-lpvirt-dll
          path: dist/lpvirt.dll
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish to the Mooncakes registry, so
  # `moonx riantr/LunaPack@latest` resolves to this version.
  # ---------------------------------------------------------------------------
  publish-registry:
    name: Publish to Mooncakes
    needs: [verify-tag]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install MoonBit
        shell: bash
        env:
          # Optional: pin the toolchain by setting the MOONBIT_VERSION
          # repository variable. When it is empty the latest release is
          # installed, which is what the installers do by default.
          MOONBIT_INSTALL_VERSION: ${{ vars.MOONBIT_VERSION }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The registry token is stored in the credentials file the toolchain
      # reads; it comes from the repository secret, never from the log.
      - name: Write the registry credentials
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::warning::MOONCAKES_TOKEN is not set, skipping the registry publication"
            exit 0
          fi
          mkdir -p "$HOME/.moon"
          printf '{\n  "token": "%s"\n}\n' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          chmod 600 "$HOME/.moon/credentials.json"

      - name: Publish
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "::warning::no registry token, skipping"
            exit 0
          fi
          # A re-run for a tag that was published before makes the registry
          # refuse the duplicate version. That is not a failure of the
          # release: the GitHub Release is still updated with the freshly
          # built binaries. `moon publish` also type-checks the project first,
          # so other failures (a broken build, an expired token, no network)
          # land here too - keep the wording honest about all of them.
          moon publish || {
            echo "::warning::moon publish failed (the version may already exist); continuing so the GitHub Release is still updated"
          }

  # ---------------------------------------------------------------------------
  # Attach everything to the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish the GitHub Release
    # The macOS runner is the scarce one: when none of them is free, that leg
    # is cancelled and the release is made with the binaries that were built,
    # with the missing one named in its notes. The other legs are not
    # optional, so the release waits for them and stops if one of them
    # failed.
    if: >-
      always() &&
      needs.verify-tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build-wasm.result == 'success' &&
      needs.publish-registry.result == 'success'
    needs: [verify-tag, build, build-macos, build-wasm, build-runtime, publish-registry]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        shell: bash
        run: |
          # The annotated tag carries the release notes, so they are used as
          # they are instead of being generated again.
          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$NOTES" ]; then
            NOTES="LunaPack $VERSION"
          fi
          # A binary that could not be built is named in the notes, so that the
          # release says what it holds instead of pretending to be complete.
          for name in lunapack-linux-x86_64 lunapack-macos-aarch64 lunapack-windows-x86_64.exe lunapack.wasm; do
            if [ ! -f "artifacts/$name" ]; then
              NOTES="$NOTES"$'\n\n'"The binary $name is not part of this release: the runner that builds it was not available when the tag was pushed."
            fi
          done
          # The runtime DLL comes from an optional job, so its absence has a
          # different explanation from a missing runner.
          if [ ! -f "artifacts/lpvirt.dll" ]; then
            NOTES="$NOTES"$'\n\n'"The experimental Windows in-process runtime lpvirt.dll is not attached to this release: its optional build job did not produce it. It is not needed by any CLI command."
          fi
          # Studio is built outside CI (proton_cli + CEF is a Windows desktop
          # toolchain). A release without its asset still works on the command
          # line, but `lunapack --GUI` has nothing to download, so the notes
          # say so instead of leaving a silent 404.
          if ! ls artifacts/lunapack-studio-*.zip >/dev/null 2>&1; then
            NOTES="$NOTES"$'\n\n'"LunaPack Studio is not attached to this release yet. Build it with proton_cli package --release in the Studio workspace and upload lunapack-studio-<os>-<arch>.zip here; lunapack --GUI downloads that asset by name."
          fi
          # A tag that already carries a release is reused, so re-running the
          # workflow replaces the assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "LunaPack $VERSION" --notes "$NOTES"
            echo "updated the existing release $TAG"
          else
            gh release create "$TAG" artifacts/* \
              --title "LunaPack $VERSION" \
              --notes "$NOTES"
          fi

      - name: Verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[] | .name]}'
          # A missing Studio asset is a warning, not a failed release: the CLI
          # binaries above are complete and the asset can be attached later.
          STUDIO=$(gh release view "$TAG" --json assets \
            --jq '[.assets[].name | select(startswith("lunapack-studio-"))] | length')
          if [ "$STUDIO" = "0" ]; then
            echo "::warning::no lunapack-studio-*.zip asset; --GUI cannot auto-download until it is uploaded"
          else
            echo "Studio assets attached: $STUDIO"
          fi
